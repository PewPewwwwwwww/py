<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>User Login</h1>
    <button id="fethcs">Fetch Data</button>

    <p id="post"></p>

    <h2 id="loging">Loging in....</h2>

    <script>
        const fethcs = document.getElementById("fethcs");

        async function GetUser() {

            try {
                const loging = document.getElementById("loging");
                const post = document.getElementById("post");
                const response = await fetch(`https://jsonplaceholder.typicode.com/users/1`);

                

                if(!response.ok) {
                    throw new Error("Error Fetch..");
                }

                const data = await response.json();

                
                const {username, email, address} = data;
                post.innerHTML = `
                <h1>Username: ${username}</h1>
                <h1>Email: ${email}</h1>
                <h1>address: ${address.city}</h1>
                `;

                setInterval(() => {
                    loging.textContent = 'Done logging'
                }, 3000);
                

                
            } catch (error) {
                console.log("Error: ", error);
            }
        }

        fethcs.addEventListener("click", GetUser);
    </script>
    
</body>
</html>
