<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice3</title>
</head>
<body>
    <input id="Student" type="text" placeholder="Student Name"><br>
    <input id="Book_name" type="text" placeholder="Book Name"><br>
    <input id="book_id" type="text" placeholder="Book id"><br>
    <input id="date" type="text" placeholder="Date"><br>

    <button id="Submit">Submit</button><br>

    <p id="result"></p>

    <script>
        function libray () {
            let Student = document.getElementById("Student").value;
            let book_name = document.getElementById("Book_name").value;
            let book_id = document.getElementById("book_id").value;
            let date = document.getElementById("date").value;

            document.getElementById("result").innerHTML = "Student Name: " + Student + "<br>Book name: " + book_name + "<br>book_id: " + book_id + "<br>date: " + date;
        }

        document.getElementById("Submit").addEventListener("click" , libray);
    </script>
</body>
</html>
