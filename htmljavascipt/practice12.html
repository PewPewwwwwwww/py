<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculator</h1>
    <input id=num1 placeholder="1st number">
    <input id=num2 placeholder="2nd number">
    <select name="Math" id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <button id="submit">SUBMIT</button>
    <h2 id="result"></h2>

    <script>
        const submit = document.getElementById("submit");
        submit.addEventListener("click", () => {
        const num1 =Number( document.getElementById('num1').value);
        const num2 =Number( document.getElementById('num2').value);
        const operator = document.getElementById("operator").value;
        
    
        if(operator === "+"){
            result = num1 + num2;
        }
const result = document.getElementById('result').textContent="Result= " + result;
        })
    </script>
</body>
</html>
