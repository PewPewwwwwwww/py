<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice1</title>
</head>
<body>
    <input id="name" type="text" placeholder="Student Name" required><br>
    <input id="quiz" type="number" placeholder="Quiz" required><br>
    <input id="activity" type="number" placeholder="exam" required><br>
    <input id="exam" type="number" placeholder="activity" required><br>
    <button id="Submit">Submit</button>
    <p id="result"></p>

    <script>
        function calulate() {
            let name = document.getElementById("name").value;
            let quiz = Number(document.getElementById("quiz").value);
            let activity = Number(document.getElementById("activity").value);
            let exam = Number(document.getElementById("exam").value);

            let average = (quiz + exam + activity) / 3;

            let remark;

            if (average >= 95) {
                remark = "Very Good";
            } else if (average >= 85) {
                remark = "Good"
            } else if (average >= 75) {
                remark = "Passed";
            } else {
                remark = "Failed";
            }
            
            document.getElementById("result").innerHTML = "<br>Sudent Name: " + name + "<br>Quiz: " + quiz + "<br>Actictiy: " + activity + "<br>exam: " + exam + "<br>Average: " + average + "<br>Remark: " + remark;
        }

        document.getElementById("Submit").addEventListener("click", calulate);
    </script>
</body>
</html>
