<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students and Comments</title>
</head>

<body>

    <h1>BSA Students</h1>
    <div id="studentList"></div>

    <h1>Comments from API</h1>
    <div id="commentList"></div>


    <script>

        const student = [
            {
                studentID: 1,
                name: "Erick Gozo",
                age: 20,
                course: "BSIT",
                enrolled: true,
                yearlevel: 3,
            },

            {
                studentID: 2,
                name: "PrinceAj Orias",
                age: 22,
                course: "BSIT",
                enrolled: false,
                yearlevel: 3,
            },

            {
                studentID: 3,
                name: "Artemis Morada",
                age: 25,
                course: "BSA",
                enrolled: false,
                yearlevel: 3,
            },

            {
                studentID: 4,
                name: "Artemis Morada",
                age: 25,
                course: "BSA",
                enrolled: true,
                yearlevel: 3,
            }
        ];

        student.unshift({
            studentID: 11,
            name: "Zed Bayot",
            age: 19,
            course: "BSIT",
            enrolled: true,
            yearlevel: 3,
        });

        let filterStudent = student.filter(students => students.enrolled === true );

        const studentList = document.getElementById("studentList");

        filterStudent.forEach(student => {

            studentList.innerHTML += `
                <div class="student-card">
                    <h3>${student.name}</h3>
                    <p>Student ID: ${student.studentID}</p>
                    <p>Age: ${student.age}</p>
                    <p>Course: ${student.course}</p>
                    <p>Year Level: ${student.yearlevel}</p>
                    <p>Enrolled: ${student.enrolled}</p>
                </div>
            `;

        });

        async function getComment() {

            const response = await fetch(
                "https://jsonplaceholder.typicode.com/posts/1/comments"
            );

            const data = await response.json();

            let filterComments = data.filter(comment => comment.id === 2 || comment.id === 3);

            const commentList = document.getElementById("commentList");

            filterComments.forEach(comment => {
                const { name, email, body } = comment;
                commentList.innerHTML += `
                    <div class="comment-card">
                        <h3>${name}</h3>
                        <p><strong>Email:</strong> ${email}</p>
                        <p><strong>Comment:</strong> ${body}</p>
                    </div>
                `;

            });

        }


        getComment();

    </script>

</body>
</html>
