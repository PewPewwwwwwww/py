<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatur</title>
</head>
<body>
    <form>
        <input type="text" placeholder="First Number" id="FirstNumber"><br>
        <input type="text" placeholder="Second Number" id="SecondNumber"><br>
        <select name="Math" id="Select"><br>
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <button type="button" id="submit">Submit</button>

        <p id="result"></p>   
    </form>

    <script>
        function Calculatur (operator) {
            let FirstNumber = Number(document.getElementById("FirstNumber").value);
            let SecondNumber = Number(document.getElementById("SecondNumber").value);

            let total;

            if(operator == "+"){
                total = FirstNumber + SecondNumber;
            } else if (operator == "-") {
                total = FirstNumber - SecondNumber;
            } else if (operator == "*"){
                total = FirstNumber * SecondNumber;
            } else if (operator == "/") {
                total = FirstNumber / SecondNumber;
            } else if (operator === 0 ) {
                total = "Connot Divid by 0"
            } else {
                total = "invalid operator"
            }
 
            document.getElementById("result").innerHTML = "<br>FirstNumber: " + FirstNumber + "<br>Second Number: " + SecondNumber + "<br>Result: " + total
        }

        document.getElementById("submit").addEventListener("click", function() {
            let operator = document.getElementById("Select").value;
            Calculatur(operator)
        });
       


    </script>
</body>
</html>
