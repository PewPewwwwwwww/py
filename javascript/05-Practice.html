<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: grey;
        }

        .calculation {
            color: white;
            font-size: 45px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .calculation-buttons {
            height: 60px;
            width: 60px;
            border-radius: 60%;
            border: none;
            font-size: 26px;
            cursor: pointer;
            margin-right: 5px;
        }



        .orange {
            background-color: rgb(256, 167, 10);
        }

        .grey {
            background-color: black;
            color: white;
        }

        .Clear {
            font-size: 16px;
        }


        
        
    </style>
<body>
<p class="js-calculation calculation">
    <P>
    <button class="calculation-buttons grey" onclick="updateCalculation('1')">1</button>

        <button class="calculation-buttons grey" onclick="updateCalculation('2')">2</button>

        <button class="calculation-buttons grey" onclick="updateCalculation('3')">3</button>

        <button class="calculation-buttons orange" onclick="updateCalculation('+')">+</button>
    </P>

    <p>
        <button class="calculation-buttons grey" onclick="updateCalculation('4')">4</button>

        <button class="calculation-buttons grey" onclick="updateCalculation('5')">5</button>

        <button class="calculation-buttons grey" onclick="updateCalculation('6')">6</button>

        <button class="calculation-buttons orange" onclick="updateCalculation('-')">-</button>
    </p>

    <p>
        <button class="calculation-buttons grey" onclick="updateCalculation('7')">7</button>

        <button class="calculation-buttons grey" onclick="updateCalculation('8')">8</button>

        <button class="calculation-buttons grey" onclick="updateCalculation('9')">9</button>

        <button class="calculation-buttons orange" onclick="updateCalculation('*')"> * </button>
    </p>

    <p>
        <button class="calculation-buttons grey" onclick="updateCalculation('0')">0</button>

        <button class="calculation-buttons orange" onclick="updateCalculation('.')">.</button>

        <button class="calculation-buttons grey" onclick="calculation = eval(calculation); displayCalculation(); localStorage.setItem('calculation', calculation)">=</button>

        <button class="calculation-buttons orange" onclick="updateCalculation('/')">/</button>

    </p>


    <p>
        <button class="calculation-buttons Clear" onclick="calculation = ''; displayCalculation(); localStorage.setItem('calculation', calculation)">Clear</button>
    </p>
</p>

    <script>
        let calculation = localStorage.getItem('calculation' || '');

        displayCalculation();

        function updateCalculation(value) {
            calculation += value
            displayCalculation();
            localStorage.setItem('calculation', calculation)
        }

        function displayCalculation() {
            document.querySelector('.js-calculation').innerHTML = calculation;

        }
    </script>
</body>
</html>
